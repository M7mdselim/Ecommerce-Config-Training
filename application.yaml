# =========================================================================
# Shared Configuration for All Microservices
# Managed by Spring Cloud Config Server
# Repository: https://github.com/M7mdselim/Ecommerce-Config-Training
# =========================================================================

# Shared HMAC-SHA256 JWT Secret
jwt:
  secret: ${JWT_SECRET:microservices-pro-course-secret-key-2024-minimum-256-bits}

# Shared Eureka Service Discovery
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Shared Observability (Zipkin Tracing & Actuator Metrics)
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Global Logging
logging:
  level:
    root: INFO
    com.microservice.pro: DEBUG
    com.microservices.pro: DEBUG
